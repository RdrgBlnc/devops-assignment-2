# Ruta7 on one machine: `docker compose up --build`
#
#   UI            http://localhost:8080
#   vehicles      http://localhost:8001   (GET /health)
#   reservations  http://localhost:8002   (GET /health)
#
# No password is written in this repository. The three below are read from a local .env file
# that is never committed (it is in .gitignore). Create it once with:
#     python tools/make_env.py
# which fills it with random passwords. In Azure the same values are secrets of the Container
# Apps, set by the deployment pipeline, never files in the repo.

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64   # the image has no Arm build; Docker Desktop emulates it on Apple Silicon
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Run "python tools/make_env.py" once to create the .env file}
    volumes:
      - sqldata:/var/opt/mssql      # the data survives `docker compose down`
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # Runs once per `up`, creates the two databases and logins (safe to repeat), then exits.
  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${SA_PASSWORD:?Run "python tools/make_env.py" once to create the .env file}
      VEHICLES_DB_PASSWORD: ${VEHICLES_DB_PASSWORD:?Run "python tools/make_env.py" once to create the .env file}
      RESERVATIONS_DB_PASSWORD: ${RESERVATIONS_DB_PASSWORD:?Run "python tools/make_env.py" once to create the .env file}
    volumes:
      - ./db/init.sql:/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/mssql-tools18/bin/sqlcmd -S sql -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -i /init.sql
        -v VEHICLES_DB_PASSWORD="$$VEHICLES_DB_PASSWORD"
        RESERVATIONS_DB_PASSWORD="$$RESERVATIONS_DB_PASSWORD"
    restart: "no"

  vehicles:
    build: ./services/vehicles
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql+pymssql://vehicles_app:${VEHICLES_DB_PASSWORD:?Run "python tools/make_env.py" once to create the .env file}@sql:1433/vehicles
      CORS_ORIGIN: http://localhost:8080
      GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "8001:8000"
    restart: on-failure

  # No depends_on vehicles: reservations starts and works without it, and answers 503
  # for the requests that need it (that is the designed failure, see ADR).
  reservations:
    build: ./services/reservations
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql+pymssql://reservations_app:${RESERVATIONS_DB_PASSWORD:?Run "python tools/make_env.py" once to create the .env file}@sql:1433/reservations
      VEHICLES_URL: http://vehicles:8000
      CORS_ORIGIN: http://localhost:8080
      GIT_SHA: ${GIT_SHA:-dev}
    ports:
      - "8002:8000"
    restart: on-failure

  ui:
    image: nginx:1.27-alpine
    volumes:
      - ./ui:/usr/share/nginx/html:ro
    ports:
      - "8080:80"

volumes:
  sqldata: