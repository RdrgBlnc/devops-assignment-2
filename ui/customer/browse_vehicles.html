<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Browse Available Vehicles — Ruta7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-customer">
<main class="page">
  <div class="wrap wrap--wide">
    <div class="topbar">
      <div>
        <h1 class="title">Step 1: Select Your Vehicle</h1>
        <p class="subtitle">Filter and compare the vehicles available to rent</p>
      </div>
      <a class="back" href="dashboard.html">← My Dashboard</a>
    </div>
    <div id="message" role="alert"></div>
    <form id="filters" class="filters">
      <div class="field"><label>City</label><select name="location"></select></div>
      <div class="field"><label>Category</label><select name="category"></select></div>
      <div class="field"><label>Body type</label><select name="type"></select></div>
      <div class="field"><label>Fuel</label><select name="fuel"></select></div>
      <div class="field"><label>Order by</label><select name="sort_by"></select></div>
      <button class="btn" type="submit">Apply filters</button>
    </form>
    <div id="cards" class="cards"></div>
    <div id="pager" class="pager"></div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, money, capitalize, guarded, fillSelect, applyQuery, queryFrom, renderPager, offsetParam, customerSession } = Ruta7;
const LIMIT = 24;
if (customerSession.require()) guarded(async () => {
  const meta = await Ruta7Api.vehicles.meta();
  const form = document.getElementById("filters");
  fillSelect(form.elements.location, meta.locations, { blank: "All cities" });
  fillSelect(form.elements.category, meta.categories, { blank: "All categories" });
  fillSelect(form.elements.type, meta.types, { blank: "All types" });
  fillSelect(form.elements.fuel, meta.fuels, { blank: "All fuels" });
  fillSelect(form.elements.sort_by, ["price_asc", "price_desc"], { blank: "Default",
    label: (v) => (v === "price_asc" ? "Price: low to high" : "Price: high to low") });
  applyQuery(form);
  const offset = offsetParam();
  const data = await Ruta7Api.vehicles.list({
    ...queryFrom(["location", "category", "type", "fuel", "sort_by"]), status: "active", limit: LIMIT, offset,
  });
  const cards = document.getElementById("cards");
  if (!data.items.length) cards.append(h("p", { class: "muted" }, "No vehicles match your filters."));
  data.items.forEach((v) => cards.append(h("div", { class: "card vehicle-card" },
    h("div", {},
      h("h3", {}, v.brand + " " + v.model),
      h("p", { class: "muted" }, "📍 " + capitalize(v.location) + " · " + v.category.toUpperCase())),
    h("div", { class: "specs" },
      h("div", {}, "🚘 " + capitalize(v.type)), h("div", {}, "⛽ " + capitalize(v.fuel)),
      h("div", {}, "⚙️ " + capitalize(v.transmission)), h("div", {}, "💺 " + v.seat_num + " seats"),
      h("div", {}, "🎨 " + (v.color || "N/A"))),
    h("div", { class: "foot" },
      h("div", {}, h("span", { class: "price" }, money(v.daily_rate)), h("span", { class: "muted" }, " / day")),
      h("a", { class: "btn", href: "new_rental.html?reg=" + encodeURIComponent(v.reg_num) }, "Select dates →")))));
  renderPager(document.getElementById("pager"), { total: data.total, limit: LIMIT, offset });
});
</script>
</body>
</html>
