<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Dashboard — Ruta7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-customer">
<main class="page">
  <div class="wrap">
    <div class="topbar card">
      <div>
        <h1 class="title">Customer Dashboard</h1>
        <p class="subtitle">Signed in as <strong id="who"></strong></p>
      </div>
      <div>
        <a class="btn" href="browse_vehicles.html">+ Book New Rental</a>
        <a id="logout" class="link muted" href="login.html" style="margin-left:.75rem">Switch customer</a>
      </div>
    </div>
    <div id="message" role="alert"></div>
    <h2>Your Reservations</h2>
    <div id="rentals"></div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, money, capitalize, guarded, customerSession } = Ruta7;
const customer = customerSession.require();
if (customer) {
  document.getElementById("who").textContent = customer.name + " (ID " + customer.id + ")";
  document.getElementById("logout").addEventListener("click", () => customerSession.clear());
  const badge = (status) => h("span", {
    class: "badge " + (status === "active" || status === "confirmed" ? "badge--ok" : status === "canceled" ? "badge--bad" : status === "pending" ? "badge--wait" : ""),
  }, capitalize(status));
  guarded(async () => {
    const data = await Ruta7Api.reservations.rentals({ customer_id: customer.id, limit: 500 });
    const box = document.getElementById("rentals");
    if (!data.items.length) {
      box.append(h("div", { class: "card muted" }, "You don't have any reservations yet. ",
        h("a", { class: "link", href: "browse_vehicles.html" }, "Browse the vehicles")));
      return;
    }
    const rows = data.items.slice().reverse().map((r) => h("tr", {},
      h("td", {}, "#" + r.id), h("td", { class: "mono" }, r.car_reg_num),
      h("td", {}, r.start_date), h("td", {}, r.end_date), h("td", {}, money(r.total_price)),
      h("td", {}, badge(r.status)),
      h("td", { class: "right" }, h("a", { class: "link", href: "rental_detail.html?id=" + r.id }, "Manage →"))));
    box.append(h("div", { class: "table-wrap" }, h("table", { class: "data" },
      h("thead", {}, h("tr", {}, ["Reservation", "Vehicle reg #", "Start", "End", "Total", "Status", ""].map((t) => h("th", {}, t)))),
      h("tbody", {}, rows))));
  });
}
</script>
</body>
</html>
