<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Login — Ruta7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-customer">
<main class="page">
  <div class="wrap wrap--narrow">
    <a class="back" href="../index.html">← Back to Main Page</a>
    <div class="card">
      <h1 class="title">Customer Login</h1>
      <p class="subtitle">Pick your name from the list to see your reservations.</p>
      <div id="message" role="alert"></div>
      <form id="search" class="filters" style="margin-top:1rem">
        <div class="field"><label for="q">Search (name or email)</label><input id="q" name="search" type="search"></div>
        <div class="field"><label for="location">City</label><select id="location" name="location"></select></div>
        <button class="btn" type="submit">Search</button>
      </form>
      <ul id="customers" class="pick-list"></ul>
      <div id="pager" class="pager"></div>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, capitalize, param, guarded, showError, fillSelect, applyQuery, renderPager, offsetParam, customerSession } = Ruta7;
const LIMIT = 20;
guarded(async () => {
  const meta = await Ruta7Api.reservations.meta();
  const form = document.getElementById("search");
  fillSelect(form.elements.location, meta.locations, { blank: "All cities" });
  applyQuery(form);
  const offset = offsetParam();
  const data = await Ruta7Api.reservations.customers({
    search: param("search"), location: param("location"), limit: LIMIT, offset,
  });
  const list = document.getElementById("customers");
  if (!data.items.length) list.append(h("li", { class: "muted" }, "No customers match."));
  data.items.forEach((c) => {
    list.append(h("li", {}, h("button", {
      type: "button",
      onclick: () => {
        customerSession.set({ id: c.id, name: c.name + " " + c.surname });
        window.location.href = "dashboard.html";
      },
    }, h("strong", {}, c.name + " " + c.surname), " — " + c.email + " — " + capitalize(c.location))));
  });
  renderPager(document.getElementById("pager"), { total: data.total, limit: LIMIT, offset });
});
</script>
</body>
</html>
