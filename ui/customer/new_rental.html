<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book a Vehicle — Ruta7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-customer">
<main class="page">
  <div class="wrap wrap--medium">
    <a class="back" href="browse_vehicles.html">← Step 1: Change vehicle</a>
    <div id="message" role="alert"></div>
    <div id="booking" class="card two-col" hidden>
      <div>
        <h2 id="name" class="title"></h2>
        <p id="reg" class="mono muted"></p>
        <dl id="specs" class="facts"></dl>
      </div>
      <div>
        <h3>Step 2: Reserve dates</h3>
        <p class="muted">Pick up and return at <strong id="city"></strong>.</p>
        <form id="form" class="stack">
          <div class="field"><label for="start">Start date</label><input id="start" name="start_date" type="date" required></div>
          <div class="field"><label for="end">End date</label><input id="end" name="end_date" type="date" required></div>
          <p id="total" class="muted"></p>
          <button id="submit" class="btn" type="submit">Confirm reservation</button>
        </form>
      </div>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, money, capitalize, param, today, guarded, showError, showOk, customerSession } = Ruta7;
const customer = customerSession.require();
let vehicle = null;
function updateTotal() {
  const start = document.getElementById("start").value, end = document.getElementById("end").value;
  const days = start && end ? Math.round((new Date(end) - new Date(start)) / 86400000) : 0;
  document.getElementById("total").textContent = days > 0 ? days + " day(s) × " + money(vehicle.daily_rate) + " = " + money(days * vehicle.daily_rate) : "";
}
if (customer) guarded(async () => {
  vehicle = await Ruta7Api.vehicles.get(param("reg"));
  const v = vehicle;
  document.getElementById("name").textContent = v.brand + " " + v.model;
  document.getElementById("reg").textContent = "Reg: " + v.reg_num;
  document.getElementById("city").textContent = capitalize(v.location);
  const facts = [["Category", capitalize(v.category)], ["Type", capitalize(v.type)], ["Fuel", capitalize(v.fuel)],
    ["Transmission", capitalize(v.transmission)], ["Seats", v.seat_num], ["Colour", v.color || "N/A"],
    ["Mileage", v.km + " km"], ["Daily rate", money(v.daily_rate)]];
  facts.forEach(([k, val]) => document.getElementById("specs").append(h("div", {}, h("dt", {}, k), h("dd", {}, val))));
  document.getElementById("booking").hidden = false;
  document.getElementById("start").min = today();
  document.getElementById("end").min = today();
  document.getElementById("start").addEventListener("change", updateTotal);
  document.getElementById("end").addEventListener("change", updateTotal);
  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    guarded(async () => {
      const form = event.target;
      const rental = await Ruta7Api.reservations.createRental({
        customer_id: customer.id, car_reg_num: v.reg_num,
        start_date: form.elements.start_date.value, end_date: form.elements.end_date.value,
      });
      showOk("Reservation #" + rental.id + " created for " + money(rental.total_price) + ".");
      setTimeout(() => { window.location.href = "dashboard.html"; }, 1200);
    }).finally(() => { button.disabled = false; });
  });
});
</script>
</body>
</html>
