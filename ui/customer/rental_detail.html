<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental Contract — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap wrap--narrow">
    <a class="back" href="rental_list.html">← Back to contracts</a>
    <div id="message" role="alert"></div>
    <div id="rental" class="card" hidden>
      <h1 id="heading" class="title"></h1>
      <p id="info" class="muted"></p>
      <form id="form" class="stack" style="margin-top:1.5rem">
        <div class="field"><label>Contract status</label><select name="status"></select></div>
        <div class="field"><label>Return / end date</label><input name="end_date" type="date" required></div>
        <p id="total" class="muted"></p>
        <div><button class="btn" type="submit">Save contract updates</button></div>
      </form>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { money, param, guarded, fillSelect, showOk } = Ruta7;
guarded(async () => {
  const [meta, first] = await Promise.all([Ruta7Api.reservations.meta(), Ruta7Api.reservations.rental(param("id"))]);
  let rental = first;
  const form = document.getElementById("form");
  fillSelect(form.elements.status, meta.rental_statuses);
  function render() {
    document.getElementById("heading").textContent = "Update rental #" + rental.id;
    document.getElementById("info").textContent = "Customer " + rental.customer_id + " | Vehicle " + rental.car_reg_num + " | " + rental.start_date + " to " + rental.end_date;
    document.getElementById("total").textContent = "Total price: " + money(rental.total_price) + " (recalculated when the end date changes)";
    form.elements.status.value = rental.status;
    form.elements.end_date.value = rental.end_date;
    document.getElementById("rental").hidden = false;
  }
  render();
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    guarded(async () => {
      const changes = {};
      if (form.elements.status.value !== rental.status) changes.status = form.elements.status.value;
      if (form.elements.end_date.value !== rental.end_date) changes.end_date = form.elements.end_date.value;
      if (!Object.keys(changes).length) { showOk("Nothing to change."); return; }
      rental = await Ruta7Api.reservations.updateRental(rental.id, changes);
      render();
      showOk("Contract updated.");
    });
  });
});
</script>
</body>
</html>
