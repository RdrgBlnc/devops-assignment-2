<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Directory — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap">
    <a class="back" href="dashboard.html">← Back to dashboard</a>
    <h1 class="title" style="margin-bottom:1.5rem">Customer Directory</h1>
    <div id="message" role="alert"></div>
    <form id="filters" class="filters">
      <div class="field"><label>City</label><select name="location"></select></div>
      <div class="field"><label>Search (name or email)</label><input name="search" type="search" placeholder="Type a name or email…"></div>
      <div><button class="btn" type="submit">Search</button> <a class="link muted" href="customer_list.html">Reset</a></div>
    </form>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>City</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager" class="pager"></div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, capitalize, guarded, fillSelect, applyQuery, queryFrom, renderPager, offsetParam } = Ruta7;
const LIMIT = 50;
guarded(async () => {
  const meta = await Ruta7Api.reservations.meta();
  const form = document.getElementById("filters");
  fillSelect(form.elements.location, meta.locations, { blank: "All cities" });
  applyQuery(form);
  const offset = offsetParam();
  const data = await Ruta7Api.reservations.customers({ ...queryFrom(["location", "search"]), limit: LIMIT, offset });
  const rows = document.getElementById("rows");
  if (!data.items.length) rows.append(h("tr", {}, h("td", { colspan: 4, class: "muted" }, "No customers match the query.")));
  data.items.forEach((c) => rows.append(h("tr", {},
    h("td", {}, "#" + c.id), h("td", {}, c.name + " " + c.surname), h("td", {}, c.email), h("td", {}, capitalize(c.location)))));
  renderPager(document.getElementById("pager"), { total: data.total, limit: LIMIT, offset });
});
</script>
</body>
</html>
