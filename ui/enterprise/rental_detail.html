<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental Details — Ruta7</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-customer">
<main class="page">
  <div class="wrap wrap--narrow">
    <a class="back" href="dashboard.html">← Back to dashboard</a>
    <div id="message" role="alert"></div>
    <div id="rental" class="card" hidden>
      <div class="topbar">
        <h1 id="heading" class="title"></h1>
        <span id="status" class="badge"></span>
      </div>
      <dl id="facts" class="facts"></dl>
      <form id="form" class="stack" style="margin-top:1.5rem">
        <h3>Change the return date</h3>
        <div class="field"><label for="end">End date</label><input id="end" name="end_date" type="date" required></div>
        <div>
          <button id="save" class="btn" type="submit">Update rental</button>
          <button id="cancel" class="btn btn--danger" type="button" style="margin-left:.75rem">Cancel rental</button>
        </div>
      </form>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, money, capitalize, param, guarded, showOk, customerSession } = Ruta7;
const customer = customerSession.require();
if (customer) guarded(async () => {
  let rental = await Ruta7Api.reservations.rental(param("id"));
  if (rental.customer_id !== customer.id) throw new Error("This rental belongs to another customer.");
  const box = document.getElementById("rental");
  const form = document.getElementById("form");
  function render() {
    document.getElementById("heading").textContent = "Rental #" + rental.id;
    const badge = document.getElementById("status");
    badge.textContent = capitalize(rental.status);
    badge.className = "badge " + (rental.status === "canceled" ? "badge--bad" : rental.status === "pending" ? "badge--wait" : "badge--ok");
    const facts = document.getElementById("facts");
    facts.replaceChildren();
    [["Vehicle", rental.car_reg_num], ["Start", rental.start_date], ["End", rental.end_date], ["Total", money(rental.total_price)]]
      .forEach(([k, v]) => facts.append(h("div", {}, h("dt", {}, k), h("dd", {}, v))));
    form.elements.end_date.value = rental.end_date;
    const closed = rental.status === "returned" || rental.status === "canceled";
    form.hidden = closed;
    box.hidden = false;
  }
  render();
  // Vehicle name from the vehicles service; the page works without it when that service is down.
  Ruta7Api.vehicles.get(rental.car_reg_num).then((v) => {
    const dd = document.querySelector("#facts dd");
    if (dd) dd.textContent = v.brand + " " + v.model + " (" + rental.car_reg_num + ")";
  }).catch(() => {});
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    guarded(async () => {
      rental = await Ruta7Api.reservations.updateRental(rental.id, { end_date: form.elements.end_date.value });
      render();
      showOk("Rental updated. New total: " + money(rental.total_price) + ".");
    });
  });
  document.getElementById("cancel").addEventListener("click", () => {
    if (!window.confirm("Cancel this rental?")) return;
    guarded(async () => {
      rental = await Ruta7Api.reservations.cancelRental(rental.id, customer.id);
      render();
      showOk("Rental canceled.");
    });
  });
});
</script>
</body>
</html>
