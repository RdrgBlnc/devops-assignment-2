<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rental Contracts — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap">
    <a class="back" href="dashboard.html">← Back to dashboard</a>
    <h1 class="title" style="margin-bottom:1.5rem">Rental Contracts</h1>
    <div id="message" role="alert"></div>
    <form id="filters" class="filters">
      <div class="field"><label>Status</label><select name="status"></select></div>
      <div class="field"><label>Customer ID</label><input name="customer_id" type="number" min="1" placeholder="e.g. 1"></div>
      <div><button class="btn" type="submit">Filter</button> <a class="link muted" href="rental_list.html">Reset</a></div>
    </form>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Rental</th><th>Customer</th><th>Vehicle reg #</th><th>Dates</th><th>Total</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager" class="pager"></div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, money, capitalize, guarded, fillSelect, applyQuery, queryFrom, renderPager, offsetParam } = Ruta7;
const LIMIT = 50;
guarded(async () => {
  const meta = await Ruta7Api.reservations.meta();
  const form = document.getElementById("filters");
  fillSelect(form.elements.status, meta.rental_statuses, { blank: "All statuses" });
  applyQuery(form);
  const offset = offsetParam();
  const data = await Ruta7Api.reservations.rentals({ ...queryFrom(["status", "customer_id"]), limit: LIMIT, offset });
  const rows = document.getElementById("rows");
  if (!data.items.length) rows.append(h("tr", {}, h("td", { colspan: 7, class: "muted" }, "No rentals match the filters.")));
  data.items.forEach((r) => rows.append(h("tr", {},
    h("td", {}, "#" + r.id), h("td", {}, "Customer " + r.customer_id), h("td", { class: "mono" }, r.car_reg_num),
    h("td", {}, r.start_date + " to " + r.end_date), h("td", {}, money(r.total_price)),
    h("td", {}, h("span", { class: "badge " + (r.status === "active" || r.status === "confirmed" ? "badge--ok" : r.status === "canceled" ? "badge--bad" : r.status === "pending" ? "badge--wait" : "") }, capitalize(r.status))),
    h("td", { class: "right" }, h("a", { class: "link", href: "rental_detail.html?id=" + r.id }, "Edit →")))));
  renderPager(document.getElementById("pager"), { total: data.total, limit: LIMIT, offset });
});
</script>
</body>
</html>
