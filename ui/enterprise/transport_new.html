<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Transport — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap wrap--narrow">
    <a class="back" href="dashboard.html">← Back to dashboard</a>
    <div id="message" role="alert"></div>
    <div class="card">
      <h1 class="title">Transport a vehicle</h1>
      <p class="muted">Add a vehicle to a truck or ship batch that takes it to another city. It leaves when the batch is full.</p>
      <form id="form" class="stack" style="margin-top:1.5rem">
        <div class="field"><label>Vehicle is now in</label><select name="origin" required></select></div>
        <div class="field"><label>Vehicle</label><select name="reg_num" required></select></div>
        <div class="field"><label>Final destination</label><select name="destination" required></select></div>
        <div><button id="submit" class="btn" type="submit">Add to transport queue</button></div>
      </form>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, capitalize, guarded, fillSelect, showOk } = Ruta7;
guarded(async () => {
  const meta = await Ruta7Api.vehicles.meta();
  const form = document.getElementById("form");
  fillSelect(form.elements.origin, meta.locations, { blank: "Choose a city…" });
  fillSelect(form.elements.destination, meta.locations, { blank: "Choose the destination…" });
  fillSelect(form.elements.reg_num, [], { blank: "Choose a city first" });
  const loadVehicles = (options) => guarded(async () => {
    const select = form.elements.reg_num;
    fillSelect(select, [], { blank: "Loading…" });
    if (!form.elements.origin.value) { fillSelect(select, [], { blank: "Choose a city first" }); return; }
    const data = await Ruta7Api.vehicles.list({ status: "active", location: form.elements.origin.value, limit: 500 });
    select.replaceChildren(h("option", { value: "" }, data.items.length ? "Choose a vehicle… (" + data.total + " active here)" : "No active vehicles in this city"));
    data.items.forEach((v) => select.append(h("option", { value: v.reg_num }, v.brand + " " + v.model + " — " + v.reg_num)));
  }, options);
  form.elements.origin.addEventListener("change", () => loadVehicles());
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    guarded(async () => {
      const result = await Ruta7Api.vehicles.requestTransport({
        reg_num: form.elements.reg_num.value, destination: form.elements.destination.value,
      });
      showOk(result.status === "arrived"
        ? "Done: the batch left and " + result.reg_num + " is now in " + capitalize(result.location) + "."
        : result.reg_num + " is queued; it is now waiting in " + capitalize(result.location) + " for the batch to fill.");
      await loadVehicles({ keepMessage: true });
    }).finally(() => { button.disabled = false; });
  });
});
</script>
</body>
</html>
