<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Transport Queue — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap wrap--medium">
    <a class="back" href="dashboard.html">← Back to dashboard</a>
    <div class="topbar">
      <h1 class="title">Transport queues</h1>
      <a class="btn" href="transport_new.html">+ Transport a vehicle</a>
    </div>
    <div id="message" role="alert"></div>
    <div class="card">
      <h3 style="margin-top:0">Waiting batches</h3>
      <ul id="trips" class="pick-list"></ul>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, capitalize, guarded } = Ruta7;
guarded(async () => {
  const { trips } = await Ruta7Api.vehicles.transportQueue();
  const list = document.getElementById("trips");
  if (!trips.length) list.append(h("li", { class: "muted" }, "No vehicles are waiting. Every vehicle is in its destination city."));
  trips.forEach((t) => list.append(h("li", { class: "card", style: "display:flex;justify-content:space-between;align-items:center" },
    h("span", {}, (t.mode === "ship" ? "🚢 " : "🚚 ") + capitalize(t.mode) + ": " + capitalize(t.origin) + " → " + capitalize(t.destination)),
    h("span", { class: "badge badge--wait" }, t.queued + " of " + t.needed + " vehicles"))));
});
</script>
</body>
</html>
