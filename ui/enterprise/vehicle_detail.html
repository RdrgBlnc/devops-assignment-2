<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manage Vehicle — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap wrap--medium">
    <a class="back" href="vehicle_list.html">← Back to directory</a>
    <div id="message" role="alert"></div>
    <div id="vehicle" class="card" hidden>
      <h1 id="name" class="title"></h1>
      <p id="reg" class="mono muted"></p>
      <form id="form" class="stack" style="margin-top:1.5rem">
        <h3>Editable properties</h3>
        <div class="form-grid">
          <div class="field"><label>Category</label><select name="category"></select></div>
          <div class="field"><label>Daily rate (€)</label><input name="daily_rate" type="number" step="0.01" min="0.01" required></div>
          <div class="field"><label>Status</label><select name="status"></select></div>
        </div>
        <div><button class="btn" type="submit">Save changes</button></div>
      </form>
      <h3 style="margin-top:2rem">Fixed fields</h3>
      <p class="muted">The city only changes through a transport request.</p>
      <dl id="facts" class="facts"></dl>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, capitalize, param, guarded, fillSelect, showOk } = Ruta7;
guarded(async () => {
  const [meta, first] = await Promise.all([Ruta7Api.vehicles.meta(), Ruta7Api.vehicles.get(param("reg"))]);
  let v = first;
  const form = document.getElementById("form");
  fillSelect(form.elements.category, meta.categories);
  fillSelect(form.elements.status, meta.statuses);
  function render() {
    document.getElementById("name").textContent = v.brand + " " + v.model;
    document.getElementById("reg").textContent = "Registration number: " + v.reg_num;
    form.elements.category.value = v.category;
    form.elements.status.value = v.status;
    form.elements.daily_rate.value = v.daily_rate;
    const facts = document.getElementById("facts");
    facts.replaceChildren();
    [["City", capitalize(v.location)], ["Licence plate", v.plate], ["Body type", capitalize(v.type)], ["Colour", v.color || "N/A"],
      ["Fuel", capitalize(v.fuel)], ["Transmission", capitalize(v.transmission)], ["Seats", v.seat_num], ["Odometer (km)", v.km],
      ["Manufactured", v.manufacture_date], ["Registered", v.registration_date]]
      .forEach(([k, val]) => facts.append(h("div", {}, h("dt", {}, k), h("dd", {}, val))));
    document.getElementById("vehicle").hidden = false;
  }
  render();
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    guarded(async () => {
      v = await Ruta7Api.vehicles.update(v.reg_num, {
        category: form.elements.category.value, status: form.elements.status.value,
        daily_rate: Number(form.elements.daily_rate.value),
      });
      render();
      showOk("Vehicle updated.");
    });
  });
});
</script>
</body>
</html>
