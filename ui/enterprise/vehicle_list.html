<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicle Directory — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap wrap--wide">
    <a class="back" href="dashboard.html">← Back to dashboard</a>
    <div class="topbar">
      <h1 class="title">Vehicle Directory</h1>
      <a class="btn" href="vehicle_new.html">+ Register vehicle</a>
    </div>
    <div id="message" role="alert"></div>
    <form id="filters" class="filters">
      <div class="field"><label>Status</label><select name="status"></select></div>
      <div class="field"><label>City</label><select name="location"></select></div>
      <div class="field"><label>Category</label><select name="category"></select></div>
      <div class="field"><label>Type</label><select name="type"></select></div>
      <div class="field"><label>Fuel</label><select name="fuel"></select></div>
      <div class="field"><label>Order by</label><select name="sort_by"></select></div>
      <div><button class="btn" type="submit">Filter</button> <a class="link muted" href="vehicle_list.html">Reset</a></div>
    </form>
    <div class="table-wrap">
      <table class="data">
        <thead><tr><th>Reg #</th><th>Brand / model</th><th>Category</th><th>Type</th><th>Colour</th><th>City</th><th>Rate</th><th>Status</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="pager" class="pager"></div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { h, money, capitalize, guarded, fillSelect, applyQuery, queryFrom, renderPager, offsetParam } = Ruta7;
const LIMIT = 50;
const SORTS = { price_asc: "Price: low to high", price_desc: "Price: high to low", km_asc: "Mileage: low to high", km_desc: "Mileage: high to low" };
guarded(async () => {
  const meta = await Ruta7Api.vehicles.meta();
  const form = document.getElementById("filters");
  fillSelect(form.elements.status, meta.statuses, { blank: "All statuses" });
  fillSelect(form.elements.location, meta.locations, { blank: "All cities" });
  fillSelect(form.elements.category, meta.categories, { blank: "All categories" });
  fillSelect(form.elements.type, meta.types, { blank: "All types" });
  fillSelect(form.elements.fuel, meta.fuels, { blank: "All fuels" });
  fillSelect(form.elements.sort_by, meta.sort_options, { blank: "Default", label: (v) => SORTS[v] || v });
  applyQuery(form);
  const offset = offsetParam();
  const data = await Ruta7Api.vehicles.list({
    ...queryFrom(["status", "location", "category", "type", "fuel", "sort_by"]), limit: LIMIT, offset,
  });
  const rows = document.getElementById("rows");
  if (!data.items.length) rows.append(h("tr", {}, h("td", { colspan: 9, class: "muted" }, "No vehicles match.")));
  data.items.forEach((v) => rows.append(h("tr", {},
    h("td", { class: "mono" }, v.reg_num), h("td", {}, h("strong", {}, v.brand + " " + v.model)),
    h("td", {}, capitalize(v.category)), h("td", {}, capitalize(v.type)), h("td", {}, v.color || "N/A"),
    h("td", {}, capitalize(v.location)), h("td", {}, money(v.daily_rate)),
    h("td", {}, h("span", { class: "badge " + (v.status === "active" ? "badge--ok" : "badge--bad") }, capitalize(v.status))),
    h("td", { class: "right" }, h("a", { class: "link", href: "vehicle_detail.html?reg=" + encodeURIComponent(v.reg_num) }, "Manage →")))));
  renderPager(document.getElementById("pager"), { total: data.total, limit: LIMIT, offset });
});
</script>
</body>
</html>
