<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Vehicle — Enterprise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,600;1,500&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body class="theme-enterprise">
<main class="page">
  <div class="wrap wrap--medium">
    <a class="back" href="vehicle_list.html">← Back to directory</a>
    <div id="message" role="alert"></div>
    <div class="card">
      <h1 class="title">Register a new vehicle</h1>
      <form id="form" class="form-grid" style="margin-top:1.5rem">
        <div class="field"><label>Reg num (VIN)</label><input name="reg_num" required maxlength="32" placeholder="e.g. 1HGM82633A004352"></div>
        <div class="field"><label>Plate</label><input name="plate" required maxlength="16" placeholder="e.g. 3242 NRS"></div>
        <div class="field"><label>Brand</label><input name="brand" required maxlength="50" placeholder="e.g. Toyota"></div>
        <div class="field"><label>Model</label><input name="model" required maxlength="100" placeholder="e.g. Corolla"></div>
        <div class="field"><label>Type</label><select name="type" required></select></div>
        <div class="field"><label>Category</label><select name="category" required></select></div>
        <div class="field"><label>Colour</label><select name="color" required></select></div>
        <div class="field"><label>Daily rate (€)</label><input name="daily_rate" type="number" step="0.01" min="0.01" required placeholder="39.99"></div>
        <div class="field"><label>Seats</label><input name="seat_num" type="number" min="1" value="5" required></div>
        <div class="field"><label>Initial city</label><select name="location" required></select></div>
        <div class="field"><label>Fuel</label><select name="fuel" required></select></div>
        <div class="field"><label>Transmission</label><select name="transmission" required></select></div>
        <div class="field"><label>Odometer (km)</label><input name="km" type="number" min="0" value="0" required></div>
        <div class="field"><label>Manufacture date</label><input name="manufacture_date" type="date" required></div>
        <div class="full"><button id="submit" class="btn" type="submit" style="width:100%">Save vehicle</button></div>
      </form>
    </div>
  </div>
</main>
<script src="../js/config.js"></script>
<script src="../js/api.js"></script>
<script src="../js/ui.js"></script>
<script>
const { fillSelect, guarded, showOk, today } = Ruta7;
guarded(async () => {
  const meta = await Ruta7Api.vehicles.meta();
  const form = document.getElementById("form");
  fillSelect(form.elements.type, meta.types);
  fillSelect(form.elements.category, meta.categories);
  fillSelect(form.elements.color, meta.colors, { label: (c) => c });
  fillSelect(form.elements.location, meta.locations);
  fillSelect(form.elements.fuel, meta.fuels);
  fillSelect(form.elements.transmission, meta.transmissions);
  form.elements.manufacture_date.max = today();
  form.addEventListener("submit", (event) => {
    event.preventDefault();
    const button = document.getElementById("submit");
    button.disabled = true;
    guarded(async () => {
      const f = form.elements;
      const body = {};
      ["reg_num", "plate", "brand", "model", "type", "category", "color", "location", "fuel", "transmission", "manufacture_date"]
        .forEach((name) => { body[name] = f[name].value.trim(); });
      ["seat_num", "km", "daily_rate"].forEach((name) => { body[name] = Number(f[name].value); });
      const created = await Ruta7Api.vehicles.create(body);
      showOk("Vehicle " + created.reg_num + " added.");
      form.reset();
    }).finally(() => { button.disabled = false; });
  });
});
</script>
</body>
</html>
